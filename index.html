<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 1: Basic HTML Forms</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    
    .basic-form {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .basic-form label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    .basic-form input, .basic-form textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    .basic-form button {
      margin-top: 15px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Assignment #4</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Part 1: Basic Forms</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="bootstrap.html">Part 2: Bootstrap Forms</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="register.html">Part 3: Registration Form</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center">Part 1: Basic HTML Form with HTML5 Validation</h2>
    <p class="text-center text-muted">Демонстрация встроенных атрибутов валидации браузера (required, type, minlength, maxlength).</p>

    <form class="basic-form" action="#" method="get">
     
      <label for="basic-name">Name:</label>
      <input type="text" id="basic-name" name="name" required minlength="2" maxlength="50" placeholder="Enter your full name">

      <label for="basic-email">Email:</label>
      <input type="email" id="basic-email" name="email" required placeholder="example@mail.com">

      <label for="basic-message">Message:</label>
      <textarea id="basic-message" name="message" rows="4" required minlength="10" maxlength="300" placeholder="Type your message here (10-300 characters)..."></textarea>

      <button type="submit">Submit Form</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
