<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Part 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Assignment #4</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="index.html">Part 1: Basic Forms</a>
        <a class="nav-link" href="bootstrap.html">Part 2: Bootstrap Forms</a>
        <a class="nav-link" href="register.html">Part 3: Registration</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card p-4 mx-auto" style="max-width: 600px;">
      <h2 class="mb-3">Part 1: Simple Contact Form & HTML5 Validation</h2>
      <form action="#" method="POST">
        <div class="mb-3">
          <label for="userName" class="form-label">Full Name:</label>
          <input type="text" id="userName" name="userName" class="form-control" 
                 required minlength="2" maxlength="50" placeholder="Enter your full name">
        </div>

        <div class="mb-3">
          <label for="userEmail" class="form-label">Email Address:</label>
          <input type="email" id="userEmail" name="userEmail" class="form-control" 
                 required placeholder="name@example.com">
        </div>

        <div class="mb-3">
          <label for="userMessage" class="form-label">Message:</label>
          <textarea id="userMessage" name="userMessage" rows="4" class="form-control" 
                    required minlength="10" maxlength="300" placeholder="Type your message here..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
  </div>

</body>
</html>
